# The app's configuration. `shopify app config link` created the app record and wrote client_id;
# `shopify app dev` keeps application_url and redirect_urls pointed at the current tunnel;
# `shopify app deploy` uploads the rest (scopes, webhooks, events) to Shopify.
client_id = "fe474784a47726e6213eb880b74c9852"
name = "ReviewMini"
application_url = "https://reviewmini.shipbytes.dev"
embedded = true

[access_scopes]
scopes = "read_products,write_products"

[webhooks]
api_version = "2026-10"

  # Classic webhooks: the app lifecycle and the three privacy topics every app must answer.
  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/api/webhooks"

  [[webhooks.subscriptions]]
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]
  uri = "/api/webhooks"

# Events: the newer delivery mechanism, GraphQL-shaped. One subscription, so that reviews
# of a deleted product are deleted with it.
[events]
api_version = "2026-10"

  [[events.subscription]]
  handle = "product-deleted"
  topic = "Product"
  actions = [ "delete" ]
  uri = "/api/events"

[build]
automatically_update_urls_on_dev = true

[auth]
# Token exchange needs no OAuth redirect, but the CLI still wants one entry here and
# rewrites it to the tunnel during `shopify app dev`.
redirect_urls = [ "https://reviewmini.shipbytes.dev/auth/patch-id-token" ]

# App-owned product metafields, created on every shop by `shopify app deploy`. The
# storefront block in part 6 reads them, so they are public on the storefront.
[product.metafields.reviewmini.rating_average]
name = "Rating average"
description = "Average rating of approved ReviewMini reviews, 1 to 5"
type = "number_decimal"
access.storefront = "public_read"

[product.metafields.reviewmini.rating_count]
name = "Rating count"
description = "Number of approved ReviewMini reviews"
type = "number_integer"
access.storefront = "public_read"
