# Tells the Shopify CLI how to run this app during `shopify app dev`. The CLI starts the
# dev command below, sets SERVER_PORT (which `php artisan serve` reads), and tunnels to it.
# `npm run dev` (see package.json) starts three processes side by side: the web server,
# the queue worker for the metafield job, and Vite rebuilding the admin UI on every save.
name = "ReviewMini"
roles = ["frontend", "backend"]
webhooks_path = "/api/webhooks"

[commands]
dev = "npm run dev"
